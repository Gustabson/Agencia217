<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Agencia 217 — Documentos y enlaces útiles." />
  <title>Agencia 217 · Documentos y enlaces</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/img/icon-512.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="application-name" content="Agencia 217" />
  <meta name="apple-mobile-web-app-title" content="Agencia 217" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('a217-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#top" aria-label="Inicio Agencia 217">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="36" height="36" role="img" aria-label="Logo 217">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#a855f7"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#g)"/>
            <text x="24" y="31" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="18" fill="#fff" letter-spacing="-0.5">217</text>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Agencia 217</span>
          <span class="brand-sub">Documentos y enlaces</span>
        </span>
      </a>

      <div class="header-actions">
        <label class="search-box" aria-label="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Buscar documentos y enlaces..." autocomplete="off" />
          <kbd>/</kbd>
        </label>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="top" class="container">
    <section class="hero">
      <h1>Bienvenido a <span class="grad">Agencia 217</span></h1>
      <div class="hero-stats">
        <div class="stat"><strong data-count="documentos">0</strong><span>Documentos</span></div>
        <div class="stat"><strong data-count="enlaces">0</strong><span>Enlaces</span></div>
      </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Categorías">
      <button class="tab active" role="tab" data-filter="documentos">Documentos</button>
      <button class="tab" role="tab" data-filter="enlaces">Enlaces</button>
    </nav>

    <section class="grid" id="grid" aria-live="polite"></section>

    <p class="empty" id="empty" hidden>No se encontraron resultados.</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© <span id="year"></span> Agencia 217</span>
      <span class="dot">·</span>
      <a href="https://github.com/gustabson/Agencia217" target="_blank" rel="noopener">Ver en GitHub</a>
    </div>
  </footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
